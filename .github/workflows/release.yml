name: release

# Tag a version and the binaries follow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cheap insurance: a release that does not pass its own checks is worse
      # than no release.
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          [ "${{ runner.os }}" = "Windows" ] && suffix=".exe"
          for bin in wicara wicara-hub; do
            cp "target/${{ matrix.target }}/release/$bin$suffix" "dist/$bin$suffix"
          done
          cp README.md LICENSE dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../wicara-${{ matrix.target }}.zip" .
          else
            tar czf "../wicara-${{ matrix.target }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wicara-${{ matrix.target }}
          path: wicara-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum wicara-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wicara-*
            SHA256SUMS
          generate_release_notes: true
